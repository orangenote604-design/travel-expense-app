<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>旅行編集・削除</title><link rel="stylesheet" href="css/style.css" /></head>
<body>
<header class="site-header"><div class="container site-header-inner"><div class="site-title">旅費申請システム</div><nav class="nav"><a href="index.html">申請入力</a><a href="list.html">申請一覧</a><a href="members.html">部員一覧</a><a href="trips.html" class="active">旅行一覧</a></nav></div></header>
<main class="page"><div class="container"><h1 class="page-title">旅行編集・削除</h1><div id="message" class="message"></div><section class="card"><h2 class="card-title">編集</h2><form id="tripEditForm"><div class="grid grid-2"><div class="field"><label for="currentTripName">現在の旅行名</label><input type="text" id="currentTripName" readonly /></div><div class="field"><label for="tripName">新しい旅行名</label><input type="text" id="tripName" required /></div><div class="field"><label for="departureFrom">出発地</label><input type="text" id="departureFrom" required /></div><div class="field"><label for="arrivalTo">到着地</label><input type="text" id="arrivalTo" required /></div><div class="field"><label for="returnFrom">帰路出発地</label><input type="text" id="returnFrom" /></div><div class="field"><label for="returnTo">帰路到着地</label><input type="text" id="returnTo" /></div><div class="field field-span-2"><label for="routeNote">経由地等補足</label><textarea id="routeNote"></textarea></div><div class="field"><label for="outboundDistance">往路距離</label><input type="number" id="outboundDistance" step="0.1" min="0" required /></div><div class="field inline-check"><input type="checkbox" id="separateReturn" /><label for="separateReturn">復路距離を個別入力する</label></div><div class="field hidden" id="returnDistanceField"><label for="returnDistance">復路距離</label><input type="number" id="returnDistance" step="0.1" min="0" /></div><div class="field"><label for="roundTripDistance">往復距離</label><input type="number" id="roundTripDistance" class="amount-box" readonly /></div></div><p class="note">旅行マスタを編集しても、過去の申請データに保存された旅行名・経路情報は自動更新されません。</p><div class="button-row"><button type="submit" class="primary">更新する</button><button type="button" class="danger" id="deleteTripButton">削除する</button><a href="trips.html" class="button-link secondary">旅行一覧へ戻る</a></div></form></section></div></main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/common.js"></script><script src="js/trip-edit.js"></script>
</body></html>
