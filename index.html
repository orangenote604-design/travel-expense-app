<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>旅費申請入力</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay show">
    <div class="loading-panel">
      <div class="loading-spinner"></div>
      <div id="loadingOverlayText">画面を読み込み中...</div>
    </div>
  </div>
  <header class="site-header">
    <div class="container site-header-inner">
      <div class="site-title">旅費申請システム</div>
      <nav class="nav">
        <a href="index.html" class="active">申請入力</a>
        <a href="list.html">申請一覧</a>
        <a href="members.html">部員一覧</a>
        <a href="trips.html">旅行一覧</a>
      </nav><a href="manual.html" class="button-link primary" style="margin-left:auto;white-space:nowrap;">操作マニュアル</a>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <h1 class="page-title" id="pageTitle">旅費申請入力</h1>
      <div id="message" class="message"></div>

      <form id="travelForm">
        <section class="card">
          <h2 class="card-title">基本情報</h2>
          <div class="grid grid-2">
            <div class="field"><label for="travelDate">旅費発生日</label><input type="date" id="travelDate" required /></div>
            <div class="field"><label for="fiscalYear">年度</label><input type="text" id="fiscalYear" readonly /></div>
            <div class="field"><label for="controlNo">管理番号</label><input type="text" id="controlNo" readonly /></div>
            <div class="field"><label for="tripName">旅行名</label><select id="tripName" required><option value="">選択してください</option></select></div>
            <div class="field"><label for="driverName">運転者</label><select id="driverName" required><option value="">選択してください</option></select></div>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">旅行情報（旅行マスタから自動入力）</h2>
          <div class="grid grid-2">
            <div class="field"><label for="departureFrom">出発地</label><input type="text" id="departureFrom" readonly /></div>
            <div class="field"><label for="arrivalTo">到着地</label><input type="text" id="arrivalTo" readonly /></div>
            <div class="field"><label for="returnFrom">帰路出発地</label><input type="text" id="returnFrom" readonly /></div>
            <div class="field"><label for="returnTo">帰路到着地</label><input type="text" id="returnTo" readonly /></div>
            <div class="field field-span-2"><label for="routeNote">経由地等補足</label><textarea id="routeNote" readonly></textarea></div>
            <div class="field"><label for="outboundDistance">往路距離</label><input type="number" id="outboundDistance" step="0.1" min="0" readonly /></div>
            <div class="field inline-check"><input type="checkbox" id="separateReturn" disabled /><label for="separateReturn">復路距離を個別入力する</label></div>
            <div class="field hidden" id="returnDistanceField"><label for="returnDistance">復路距離</label><input type="number" id="returnDistance" step="0.1" min="0" readonly /></div>
            <div class="field"><label for="roundTripDistance">往復距離</label><input type="number" id="roundTripDistance" class="amount-box" readonly /></div>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">費用情報</h2>
          <div class="grid grid-2">
            <div class="field"><label for="driverAllowance">運転手当</label><input type="number" id="driverAllowance" readonly /></div>
            <div class="field"><label for="gasolineFee">ガソリン代</label><input type="number" id="gasolineFee" readonly /></div>
            <div class="field"><label for="parkingFee">駐車場利用料</label><input type="number" id="parkingFee" min="0" step="1" value="0" /></div>
            <div class="field"><label for="tollFee">高速道路利用料</label><input type="number" id="tollFee" min="0" step="1" value="0" /></div>
            <div class="field"><label for="otherFee">その他</label><input type="number" id="otherFee" min="0" step="1" value="0" /></div>
            <div class="field hidden" id="otherDetailField"><label for="otherDetail">その他内容</label><input type="text" id="otherDetail" /></div>
            <div class="field"><label for="paymentAmount">支給額</label><input type="number" id="paymentAmount" class="amount-box" readonly /></div>
          </div>
          <p class="note hidden" id="manualFeeNote">往復距離の四捨五入値が301km以上の場合、運転手当とガソリン代は手入力です。</p>
        </section>

        <section class="card">
          <h2 class="card-title">補足</h2>
          <div class="grid grid-2">
            <div class="field inline-check"><input type="checkbox" id="paidFlag" /><label for="paidFlag">支払い済み</label></div>
            <div></div>
            <div class="field field-span-2"><label for="remarks">備考</label><textarea id="remarks"></textarea></div>
          </div>
        </section>

        <div class="button-row">
          <button type="submit" class="primary" id="submitButton">登録する</button>
          <button type="button" class="secondary" id="clearButton">入力内容をクリア</button>
          <a href="list.html" class="button-link secondary">申請一覧へ</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
